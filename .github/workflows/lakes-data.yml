name: Build lake data pack

on:
  push:
    branches: [main]
    paths: ["data-pipeline/**", ".github/workflows/lakes-data.yml"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      min_area_km2:
        description: Smallest lake to include (km²)
        default: "0.25"

permissions:
  contents: write

jobs:
  build:
    if: github.event_name != 'release' || github.event.release.tag_name == 'hydrolakes-source'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r data-pipeline/requirements.txt
      - name: Download HydroLAKES
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p work && cd work
          # data.hydrosheds.org refuses downloads from GitHub's servers, so the
          # original zip is uploaded by hand to the "hydrolakes-source" release
          # (download it from https://www.hydrosheds.org/products/hydrolakes).
          gh release download hydrolakes-source --pattern 'HydroLAKES_polys_v10_shp.zip' --output hl.zip
          unzip -q hl.zip
          find . -name "*.shp"
      - name: Build cells
        run: python data-pipeline/build_lakes.py "$(find work -name 'HydroLAKES_polys_v10.shp' | head -1)" out "${{ inputs.min_area_km2 || '0.25' }}"
      - name: Publish release lakes-v1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          du -sh out; ls out | wc -l
          gh release view lakes-v1 >/dev/null 2>&1 || gh release create lakes-v1 --title "Lake data pack v1" --notes "Global lakes for Kite Map, from HydroLAKES v1.0 (Messager et al. 2016, CC BY 4.0). The app downloads these files automatically." --latest=false
          gh release upload lakes-v1 out/* --clobber
