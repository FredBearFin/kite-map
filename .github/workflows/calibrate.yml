name: Spot scoring check

on:
  push:
    paths: ["src/**", "tools/**", ".github/workflows/calibrate.yml"]

jobs:
  calibrate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        source: [era5, hires]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node tools/calibrate.mjs calibration.json
        env:
          WIND_GRID: ${{ matrix.source == 'hires' && '0' || '0.25' }}
          WIND_SOURCE: ${{ matrix.source }}
      - uses: actions/upload-artifact@v4
        with:
          name: calibration-${{ matrix.source }}
          path: calibration.json
