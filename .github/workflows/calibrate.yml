name: Spot scoring check

on:
  push:
    paths: ["src/**", "tools/**", ".github/workflows/calibrate.yml"]

jobs:
  calibrate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: before, source: era5, grid: "0.25", nodepth: "1" }
          - { name: after, source: hires, grid: "0.1", nodepth: "" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node tools/calibrate.mjs calibration.json
        env:
          WIND_GRID: ${{ matrix.grid }}
          WIND_SOURCE: ${{ matrix.source }}
          NO_DEPTH: ${{ matrix.nodepth }}
      - uses: actions/upload-artifact@v4
        with:
          name: calibration-${{ matrix.name }}
          path: calibration.json
