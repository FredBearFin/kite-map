name: Screenshots

on:
  push:
    paths: ["src/**", "index.html", "tools/screenshots.cjs", ".github/workflows/screenshots.yml"]

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --no-save playwright@1.49.1 && npx playwright install --with-deps chromium
      - run: npx vite build
      - run: |
          npx vite preview --port 4173 &
          sleep 3
          node tools/screenshots.cjs screenshots
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/*.png
